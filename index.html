<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>MCQ OMR Practice</title>
<meta name="theme-color" content="#2f6fed">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<style>
:root{--bg:#f3f5fb;--card:#fff;--tx:#141a2a;--mu:#6a7489;--pr:#4f46e5;--pr2:#7c3aed;--ok:#10b981;--bad:#ef4444;--wa:#f59e0b;--bd:#e4e8f1;--soft:#eef1f8;--miss:#fef2f2;--low:#fffbeb;--bs:38px;--sh:0 1px 2px #1018280a,0 6px 20px #1018280d;--grad:linear-gradient(135deg,var(--pr),var(--pr2))}
[data-theme=dark]{--bg:#0b0f19;--card:#141a29;--tx:#e8ecf5;--mu:#8e98ad;--bd:#232c3f;--soft:#1d2536;--miss:#3b1518;--low:#3a2c0d;--pr:#6366f1;--pr2:#8b5cf6;--sh:0 1px 2px #0006,0 8px 24px #0005}
body.big{--bs:48px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font:15px/1.45 Inter,"Hind Siliguri",system-ui,sans-serif;background:var(--bg);color:var(--tx);min-height:100vh}
header{background:var(--grad);color:#fff;height:56px;padding:0 12px;font-weight:700;position:sticky;top:0;z-index:6;display:flex;justify-content:space-between;align-items:center;gap:10px;box-shadow:0 4px 18px #4f46e540}
header.flash{animation:fl .5s 4}@keyframes fl{50%{background:var(--bad)}}
.logo{width:32px;height:32px;border-radius:10px;background:#fff2;display:grid;place-items:center;font-size:16px;flex:none}
.hb{background:#ffffff26;border:1px solid #ffffff33;color:#fff;border-radius:10px;height:36px;min-width:40px;font-size:17px;cursor:pointer}
#ttl{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:17px;letter-spacing:-.2px}.hr{display:flex;gap:8px;align-items:center}
#timer{font-variant-numeric:tabular-nums;font-size:18px;background:#0003;padding:4px 10px;border-radius:999px}#timer:empty{display:none}
main{max-width:720px;margin:auto;padding:14px 14px 40px}
section{animation:in .25s ease}@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--sh)}
h2{margin:0 0 12px;font-size:16px;font-weight:700;letter-spacing:-.2px;display:flex;align-items:center;gap:8px}
h2::before{content:"";width:4px;height:16px;border-radius:2px;background:var(--grad)}
.hero{background:var(--grad);color:#fff;border:0;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:#ffffff14;pointer-events:none}
.hero h1{margin:0;font-size:22px;letter-spacing:-.4px}.hero p{margin:4px 0 14px;opacity:.85;font-size:13px}
.hs{display:flex;gap:8px;margin-bottom:14px}.hs div{flex:1;background:#ffffff1f;border-radius:12px;padding:8px 10px}.hs b{display:block;font-size:20px}.hs span{font-size:11px;opacity:.85}
.hero .btn{background:#fff;color:var(--pr);box-shadow:0 4px 14px #0002}.hero .btn.ok{background:#10b981;color:#fff}
label{display:block;margin:10px 0 5px;color:var(--mu);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px}
input,select{width:100%;padding:11px 12px;border:1.5px solid var(--bd);border-radius:12px;font:inherit;font-size:16px;background:var(--card);color:var(--tx);outline:none;transition:.15s}
input:focus,select:focus{border-color:var(--pr);box-shadow:0 0 0 4px #4f46e522}
input[type=file]{padding:14px;border-style:dashed;background:var(--soft)}
.chk{display:flex;align-items:center;gap:10px;margin:6px 0;text-transform:none;font-size:14px;color:var(--tx);letter-spacing:0}
input[type=checkbox]{appearance:none;-webkit-appearance:none;width:44px;height:26px;border-radius:999px;background:var(--bd);position:relative;cursor:pointer;padding:0;border:0;flex:none;transition:.2s}
input[type=checkbox]::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #0003;transition:.2s}
input[type=checkbox]:checked{background:var(--pr)}input[type=checkbox]:checked::after{left:21px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;padding:12px 18px;font:inherit;font-size:15px;font-weight:600;background:var(--grad);color:#fff;margin:4px 6px 4px 0;cursor:pointer;box-shadow:0 4px 12px #4f46e533;transition:transform .1s,filter .15s}
.btn:active{transform:scale(.96)}.btn.g{background:var(--soft);color:var(--tx);box-shadow:none}.btn.ok{background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 4px 12px #10b98133}.btn.sm{padding:8px 12px;font-size:14px;border-radius:10px}.btn:disabled{opacity:.5}
.btn.wide{width:100%;margin:6px 0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1;min-width:90px}
canvas{width:100%;touch-action:none;border-radius:12px;background:#111;margin:6px 0}
.q{display:flex;align-items:center;gap:8px;padding:8px 6px;border-radius:12px;scroll-margin-top:110px;transition:background .2s}
.q+.q{margin-top:2px}.q:nth-child(even){background:color-mix(in srgb,var(--soft) 45%,transparent)}
.q>b{width:34px;text-align:right;color:var(--mu);font-size:13px;font-variant-numeric:tabular-nums;flex:none}.bb{display:flex;gap:8px;flex-wrap:wrap}
.o{width:var(--bs);height:var(--bs);border-radius:50%;border:2px solid #c3cad8;background:var(--card);font:inherit;font-weight:700;color:var(--mu);font-size:14px;display:inline-flex;align-items:center;justify-content:center;flex:none;cursor:pointer;transition:transform .12s,background .15s;box-shadow:inset 0 1px 2px #0000000d}
[data-theme=dark] .o{border-color:#3a455c}
.o.on{background:var(--grad);border-color:transparent;color:#fff;transform:scale(1.08);box-shadow:0 3px 10px #4f46e555}
.q.miss{background:var(--miss)!important}.q.miss>b{color:var(--bad);font-weight:800}.q.low{background:var(--low)!important}.q.low>b{color:var(--wa);font-weight:800}
.o.c{background:var(--ok);border-color:var(--ok);color:#fff}.o.w{background:var(--bad);border-color:var(--bad);color:#fff}
.fl{margin-left:auto;border:0;background:var(--soft);width:36px;height:36px;border-radius:10px;font-size:17px;filter:grayscale(1);opacity:.45;cursor:pointer;flex:none}.fl.on{filter:none;opacity:1;background:#f59e0b22}
.mu{color:var(--mu);font-size:13px}.hide{display:none!important}
.big{font-size:34px;font-weight:800;letter-spacing:-1px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;text-align:center;margin-top:14px}.stats div{background:var(--soft);border-radius:12px;padding:10px 4px}.stats b{font-size:20px}
#prog{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin:10px 0}#prog i{display:block;height:100%;width:0;background:var(--grad);transition:width .2s}
pre{white-space:pre-wrap;font-size:11px;max-height:150px;overflow:auto;background:var(--soft);padding:8px;border-radius:8px}
details summary{cursor:pointer;margin-top:6px}
.ti{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--soft)}.ti:last-child{border:0}.ta{display:flex;flex:none}
.av{width:42px;height:42px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.tl{display:flex;gap:12px;align-items:center;min-width:0}.tl>div{min-width:0}.tl b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pct{font-weight:800;font-size:16px;padding:4px 10px;border-radius:999px;background:var(--soft);flex:none}.okc{color:var(--ok)}.wac{color:var(--wa)}.badc{color:var(--bad)}
#pal{position:sticky;top:56px;z-index:4;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;gap:6px;overflow-x:auto;padding:10px 2px;margin:0 -2px 6px;scrollbar-width:none}
.pc{min-width:38px;height:32px;border-radius:10px;border:1.5px solid var(--bd);background:var(--card);color:var(--mu);font:inherit;font-size:12px;font-weight:700;flex:none}.pc.a{background:var(--grad);color:#fff;border-color:transparent}.pc.f{box-shadow:0 0 0 2px var(--wa)}
#pz{position:fixed;inset:0;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,100px);background:#141a2a;color:#fff;padding:12px 18px;border-radius:14px;transition:.3s;z-index:30;max-width:90%;box-shadow:0 8px 24px #0004;font-weight:600}#toast.on{transform:translate(-50%,0)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-bottom:1px solid var(--soft);text-align:left}th{color:var(--mu);font-size:12px;font-weight:600}
.lg{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:middle;margin:0 4px 0 10px}.lg:first-child{margin-left:0}
svg text{fill:var(--mu);font-size:9px}
.ring{display:flex;align-items:center;gap:18px}.ring svg{width:116px;height:116px;flex:none}.ring svg text{fill:var(--tx);font-size:20px;font-weight:800}
.ring circle{fill:none;stroke-width:10}.ring .bgc{stroke:var(--soft)}.ring .fgc{stroke-linecap:round;transition:stroke-dashoffset 1s ease;transform:rotate(-90deg);transform-origin:50% 50%}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:7px 12px;margin:3px;font-size:13px;font-weight:600;cursor:pointer}
.empty{text-align:center;padding:18px;color:var(--mu)}.empty div{font-size:34px}
</style></head><body>
<header><button id="hb" class="hb hide" onclick="goHome()">←</button><span id="lg0" class="logo">◉</span><span id="ttl">MCQ OMR</span><span class="hr"><span id="timer"></span><button id="pb" class="hb hide" onclick="pause()">⏸</button></span></header>
<main>

<!-- HOME -->
<section id="vHome">
<div class="card hero"><h1 data-t="hello"></h1><p data-t="tag"></p>
<div class="hs"><div><b id="hsT">0</b><span data-t="testsN"></span></div><div><b id="hsA">0</b><span data-t="attempts"></span></div><div><b id="hsB">–</b><span data-t="avg"></span></div></div>
<button class="btn" onclick="newTest()">＋ <span data-t="new"></span></button><button id="resumeBox" class="btn ok" onclick="resumeCur()" data-t="resume"></button></div>
<div class="card"><h2 data-t="saved"></h2><div id="tlist"></div></div>
<div class="card"><h2 data-t="progress"></h2><select id="hsel" onchange="renderHist()"></select>
<svg id="chart" viewBox="0 0 300 120" style="width:100%;margin-top:8px"></svg><div id="hlist"></div></div>
<div class="card"><h2 data-t="settings"></h2>
<div class="row"><label class="chk"><input type="checkbox" id="cDark" onchange="setCfg()"> <span data-t="dark"></span></label><label class="chk"><input type="checkbox" id="cBig" onchange="setCfg()"> <span data-t="big"></span></label></div>
<div class="row"><div><label data-t="lang"></label><select id="cLang" onchange="setCfg()"><option value="en">English</option><option value="bn">বাংলা</option></select></div><div><label data-t="warn"></label><input id="cWarn" type="number" min="0" onchange="setCfg()"></div></div>
<h2 style="margin-top:14px" data-t="backup"></h2>
<button class="btn g" onclick="exportData()" data-t="export"></button><button class="btn g" onclick="$('impf').click()" data-t="import"></button><input type="file" id="impf" accept=".json,application/json" class="hide" onchange="importData(this)">
</div>
</section>

<!-- EDIT TEST -->
<section id="vEdit" class="hide">
<div class="card">
<label data-t="name"></label><input id="fName">
<div class="row"><div><label data-t="total"></label><input id="fN" type="number" min="1" max="300"></div>
<div><label data-t="opts"></label><select id="fO"><option value="4">A–D (4)</option><option value="5">A–E (5)</option></select></div>
<div><label data-t="time"></label><input id="fMIN" type="number" min="1"></div></div>
<div class="row"><div><label data-t="start"></label><input id="fST" type="number" min="0"></div>
<div><label data-t="neg"></label><select id="fNeg"><option value="0">0</option><option value="0.25">0.25</option><option value="0.5">0.5</option><option value="1">1</option></select></div></div>
<label data-t="sec"></label><input id="fSec" placeholder="English:1-40, Math:41-100">
</div>
<div class="card">
<h2 data-t="scanKey"></h2>
<p class="mu" data-t="scanHelp"></p>
<input type="file" id="file" accept="image/*">
<div id="ed" class="hide">
<div class="row" style="margin:8px 0"><button class="btn g" onclick="rot(-1)">⟲</button><button class="btn g" onclick="rot(1)">⟳</button><button class="btn g" onclick="crop=null;draw()" data-t="clearBox"></button></div>
<canvas id="cv"></canvas>
<button class="btn" id="scanb" onclick="scan()">🔍 <span data-t="scan"></span></button>
<div id="prog"><i></i></div><div id="msg" class="mu"></div>
<details><summary class="mu">OCR text</summary><pre id="raw"></pre></details>
</div></div>
<div class="card">
<h2><span data-t="key"></span> <span id="kc" class="mu"></span></h2>
<p class="mu"><span class="lg" style="background:var(--miss);border:1px solid var(--bad)"></span><span data-t="lgMiss"></span><span class="lg" style="background:var(--low);border:1px solid var(--wa)"></span><span data-t="lgLow"></span></p>
<div id="kg"></div>
</div>
<div class="card"><button class="btn ok" onclick="saveTest(1);beginExam(cur,null)">▶ <span data-t="startExam"></span></button><button class="btn" onclick="saveTest(1);toast(T('savedMsg'))" data-t="save"></button><button class="btn g" onclick="clearKey()" data-t="clear"></button></div>
</section>

<!-- EXAM -->
<section id="vExam" class="hide">
<div id="pal"></div>
<div class="card"><p class="mu" data-t="examHelp"></p><div id="eg"></div>
<button class="btn ok" onclick="if(confirm(T('confirmSubmit')))submit()">✔ <span data-t="submit"></span></button></div>
</section>
<div id="pz" class="hide"><div class="big">⏸ <span data-t="paused"></span></div><div id="pzt" class="mu"></div><button class="btn ok" onclick="resumeTimer()" data-t="cont"></button></div>

<!-- RESULT -->
<section id="vRes" class="hide">
<div class="card"><div class="ring"><svg viewBox="0 0 120 120"><defs><linearGradient id="rgr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="var(--pr)"/><stop offset="1" stop-color="var(--pr2)"/></linearGradient></defs><circle class="bgc" cx="60" cy="60" r="50"/><circle id="rgc" class="fgc" cx="60" cy="60" r="50" stroke="url(#rgr)" stroke-dasharray="314.16" stroke-dashoffset="314.16"/><text id="scp" x="60" y="67" text-anchor="middle"></text></svg>
<div><div class="mu" id="rName"></div><div class="big" id="sc"></div><div class="mu" id="tm"></div></div></div>
<div class="stats"><div><b id="cC" class="okc"></b><br><span class="mu" data-t="correct"></span></div><div><b id="cW" class="badc"></b><br><span class="mu" data-t="wrong"></span></div><div><b id="cS"></b><br><span class="mu" data-t="skipped"></span></div><div><b id="cF" class="wac"></b><br><span class="mu" data-t="flagged"></span></div></div></div>
<div class="card" id="secBox"></div>
<div class="card" id="slowBox"></div>
<div class="card"><div class="row"><select id="rf" onchange="renderList()"><option value="x"></option><option value="w"></option><option value="s"></option><option value="f"></option><option value="a"></option></select></div><div id="rg"></div></div>
<div class="card"><button class="btn" onclick="retake(0)" data-t="retake"></button><button class="btn" onclick="retake(1)" data-t="retakeWrong"></button><button class="btn g" onclick="shareImg()">📤 <span data-t="share"></span></button><button class="btn g" onclick="goHome()" data-t="home"></button></div>
</section>
</main>
<div id="toast"></div>
<script>
const $=id=>document.getElementById(id);
const S={get(k,d){try{const v=localStorage.getItem('omr_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{v==null?localStorage.removeItem('omr_'+k):localStorage.setItem('omr_'+k,JSON.stringify(v))}catch(e){toast('Storage full!')}}};
let tests=S.get('tests',[]),hist=S.get('hist',[]),cfg=Object.assign({dark:matchMedia('(prefers-color-scheme: dark)').matches?1:0,big:0,lang:'en',warn:5},S.get('cfg',{}));
let cur=null,E=null,R=null,tint;
const L=j=>'ABCDE'[j],uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);

 renderExam();show('vExam');resumeTimer()}
function renderExam(){const t=E.t;$('pal').innerHTML=E.qs.map(i=>`<button class="pc" id="p${i}" onclick="$('e${i}').scrollIntoView({behavior:'smooth'})">${i+t.ST}</button>`).join('');
 $('eg').innerHTML=E.qs.map(i=>rowHTML('e',i,i+t.ST,t.O,E.ans[i],`<button class="fl${E.flag[i]?' on':''}" data-f="${i}">⚑</button>`)).join('');E.qs.forEach(pal);hdr()}
function pal(i){const c=$('p'+i);c.className='pc'+(E.ans[i]!=null?' a':'')+(E.flag[i]?' f':'')}
function hdr(){$('ttl').textContent=`${T('answered')} ${E.qs.filter(i=>E.ans[i]!=null).length}/${E.qs.length}`}
$('eg').onclick=e=>{const f=e.target.closest('[data-f]');if(f){const i=+f.dataset.f;E.flag[i]^=1;f.classList.toggle('on',!!E.flag[i]);pal(i);saveCur();return}
 const b=e.target.closest('.o');if(!b)return;const i=+b.dataset.i,j=+b.dataset.j,now=Date.now();E.qt[i]+=(now-E.last)/1000;E.last=now;E.ans[i]=E.ans[i]===j?null:j;$('e'+i).querySelectorAll('.o').forEach((x,k)=>x.classList.toggle('on',E.ans[i]===k));pal(i);hdr();saveCur()};
function saveCur(){S.set('cur',E)}
function resumeTimer(){$('pz').classList.add('hide');E.run=1;E.tk=E.last=Date.now();clearInterval(tint);tint=setInterval(tick,500);tick()}
function pause(silent){if(!E||!E.run)return;tick();E.run=0;clearInterval(tint);saveCur();if(silent!==1){$('pzt').textContent=fmt(E.lim-E.el)+' left';$('pz').classList.remove('hide')}}
function tick(){if(!E.run)return;const now=Date.now();E.el+=(now-E.tk)/1000;E.tk=now;const r=E.lim-E.el;$('timer').textContent=fmt(r);$('timer').style.color=r<60?'#ffd0d0':'';
 if(cfg.warn&&!E.warned&&r<=cfg.warn*60&&E.lim>cfg.warn*60){E.warned=1;navigator.vibrate&&navigator.vibrate([300,150,300]);document.querySelector('header').classList.add('flash');setTimeout(()=>document.querySelector('header').classList.remove('flash'),2200);toast(cfg.warn+' '+T('left'))}
 if(Math.round(E.el)%5===0)saveCur();
 if(r<=0){navigator.vibrate&&navigator.vibrate(600);toast(T('timesUp'));submit()}}
function resumeCur(){E=S.get('cur',null);if(!E)return renderHome();renderExam();show('vExam');E.run=0;$('pzt').textContent=fmt(E.lim-E.el)+' left';$('pz').classList.remove('hide')}
function grade(r){let c=0,w=0,s=0;const items=[];for(const i of r.qs){if(r.key[i]==null)continue;const st=r.ans[i]==null?'s':r.ans[i]===r.key[i]?'c':'w';st==='c'?c++:st==='w'?w++:s++;items.push({i,st})}const total=c+w+s,net=+(c-w*r.neg).toFixed(2);return{c,w,s,total,net,items}}
function submit(){if(E.run)tick();E.run=0;clearInterval(tint);if(E.last)E.qt=E.qt;const t=E.t,r={id:uid(),tid:t.id,name:t.name,date:Date.now(),sub:E.sub,N:t.N,O:t.O,ST:t.ST,MIN:t.MIN,neg:t.neg,sec:t.sec,key:t.key,qs:E.qs,ans:E.ans,flag:E.flag,qt:E.qt.map(x=>Math.round(x)),used:Math.round(Math.min(E.el,E.lim)),lim:E.lim};
 const g=grade(r);Object.assign(r,{c:g.c,w:g.w,s:g.s,total:g.total,net:g.net,pct:g.total?Math.round(g.net/g.total*1000)/10:0});
 hist.push(r);if(hist.length>300)hist=hist.slice(-300);S.set('hist',hist);S.set('cur',null);E=null;R=r;renderRes();show('vRes')}

/* ---------- RESULT ---------- */
function viewRes(id){R=hist.find(h=>h.id===id);if(!R)return;renderRes();show('vRes')}
function secs(r){const o=[];(r.sec||'').split(/[,;\n]/).forEach(p=>{const m=p.match(/^\s*(.*?)\s*[:=]?\s*(\d+)\s*(?:-|–|to)\s*(\d+)\s*$/i);if(m)o.push({n:m[1]||m[2]+'–'+m[3],a:+m[2],b:+m[3]})});return o}
function renderRes(){const r=R,g=grade(r);$('ttl').textContent=T('score');$('rName').textContent=r.name+' · '+new Date(r.date).toLocaleString();
 $('sc').textContent=`${g.net}/${g.total}`;$('scp').textContent=r.pct+'%';const rg=$('rgc');rg.style.transition='none';rg.style.strokeDashoffset=314.16;rg.getBoundingClientRect();rg.style.transition='';requestAnimationFrame(()=>rg.style.strokeDashoffset=314.16*(1-Math.max(0,Math.min(100,r.pct))/100));
 $('tm').textContent=`${T('timeUsed')}: ${fmt(r.used)} / ${fmt(r.lim)}${r.neg?` · −${r.neg} / ${T('wrong')}`:''}`;
 $('cC').textContent=g.c;$('cW').textContent=g.w;$('cS').textContent=g.s;$('cF').textContent=r.qs.filter(i=>r.flag[i]).length;
 const ss=secs(r);$('secBox').classList.toggle('hide',!ss.length);
 if(ss.length)$('secBox').innerHTML=`<h2>${T('sections')}</h2><table><tr><th>${T('section')}</th><th>✔</th><th>✘</th><th>–</th><th>${T('score')}</th></tr>`+ss.map(s=>{const it=g.items.filter(x=>x.i+r.ST>=s.a&&x.i+r.ST<=s.b),c=it.filter(x=>x.st==='c').length,w=it.filter(x=>x.st==='w').length,k=it.length-c-w;return `<tr><td>${esc(s.n)}</td><td>${c}</td><td>${w}</td><td>${k}</td><td><b>${+(c-w*r.neg).toFixed(2)}/${it.length}</b></td></tr>`}).join('')+'</table>';
 const slow=g.items.filter(x=>r.qt[x.i]>0).sort((a,b)=>r.qt[b.i]-r.qt[a.i]).slice(0,5);$('slowBox').classList.toggle('hide',!slow.length);
 $('slowBox').innerHTML=`<h2>${T('slow')}</h2>`+slow.map(x=>`<span class="chip" onclick="$('rf').value='a';renderList();$('r${x.i}').scrollIntoView({behavior:'smooth'})">Q${x.i+r.ST} · ${fmt(r.qt[x.i])} ${x.st==='c'?'✔':x.st==='w'?'✘':'–'}</span>`).join('');
 $('rf').value='x';renderList()}
function renderList(){const r=R,g=grade(r),f=$('rf').value;let h='';
 for(const{i,st}of g.items){if(f==='x'&&st==='c'||f==='w'&&st!=='w'||f==='s'&&st!=='s'||f==='f'&&!r.flag[i])continue;h+=`<div class="q" id="r${i}"><b>${i+r.ST}</b><div class="bb">`;
  for(let j=0;j<r.O;j++)h+=`<span class="o ${j===r.key[i]?'c':j===r.ans[i]?'w':''}">${L(j)}</span>`;
  h+=`</div><span class="mu" style="margin-left:auto;text-align:right">${r.flag[i]?'⚑ ':''}${st==='s'?T('skipped'):st==='w'?T('wrong'):'✔'}<br>${r.qt[i]?fmt(r.qt[i]):''}</span></div>`}
 $('rg').innerHTML=h||'<p class="mu">🎉</p>'}
function retake(onlyWrong){const r=R,t=tests.find(x=>x.id===r.tid)||{id:r.tid,name:r.name,N:r.N,O:r.O,ST:r.ST,MIN:r.MIN,neg:r.neg,sec:r.sec,key:r.key,conf:[]};
 if(!onlyWrong)return beginExam(t,null);const qs=grade(r).items.filter(x=>x.st!=='c').map(x=>x.i);if(!qs.length){if(confirm(T('allRight')))beginExam(t,null);return}beginExam(t,qs)}
function shareImg(){const r=R,g=grade(r),wr=g.items.filter(x=>x.st!=='c'),cols=4,W=1080,H=440+Math.ceil(wr.length/cols)*48+30,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');
 x.fillStyle='#fff';x.fillRect(0,0,W,H);x.fillStyle='#2f6fed';x.fillRect(0,0,W,110);x.fillStyle='#fff';x.font='bold 46px system-ui';x.fillText(r.name.slice(0,36),40,72);
 x.fillStyle='#1b2330';x.font='bold 96px system-ui';x.fillText(`${g.net}/${g.total}`,40,235);x.font='40px system-ui';x.fillStyle='#6b7585';x.fillText(`${r.pct}%  ·  ${fmt(r.used)}  ·  ${new Date(r.date).toLocaleDateString()}`,40,300);
 x.font='bold 40px system-ui';x.fillStyle='#1a9b55';x.fillText('✔ '+g.c,40,375);x.fillStyle='#d93838';x.fillText('✘ '+g.w,260,375);x.fillStyle='#6b7585';x.fillText('– '+g.s,480,375);
 x.font='30px system-ui';wr.forEach((it,k)=>{x.fillStyle=it.st==='w'?'#d93838':'#6b7585';x.fillText(`Q${it.i+r.ST}: ${r.ans[it.i]!=null?L(r.ans[it.i]):'–'} → ${L(r.key[it.i])}`,40+(k%cols)*255,450+Math.floor(k/cols)*48)});
 c.toBlob(async b=>{const f=new File([b],'mcq-result.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:r.name})}catch(e){}}else{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='mcq-result.png';a.click()}},'image/png')}

document.addEventListener('visibilitychange',()=>{if(document.hidden&&E&&E.run)saveCur()});
applyCfg();renderHome();
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
